function photoSetup(){const d=document.createElement('dialog');d.className='photo-setup';d.innerHTML='<h2>Preparar fotos para apresentação</h2><p>O catálogo já contém imagens ilustrativas incorporadas. Se desejar, substitua por fotos autorizadas do seu computador.</p>'+Object.entries(catalogPhotos).map(([name,p],i)=>`<section><strong>${name}</strong><br><img src="${p.src}" alt="${name}" style="width:140px;display:block;margin:8px 0"><input type="file" accept="image/*" data-model="${name}"><small id="ps${i}">${storedPhoto(name)?'Foto local salva':'Nenhuma foto local'}</small></section>`).join('')+'<button id="finishPhotos">Concluir e abrir site</button>';document.body.append(d);d.showModal();d.querySelectorAll('input').forEach((input,i)=>input.onchange=()=>{const file=input.files[0];if(!file)return;const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(1,1000/img.width,750/img.height);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(u);try{localStorage.setItem('easycar-photo-'+input.dataset.model,canvas.toDataURL('image/jpeg',0.8));d.querySelector('#ps'+i).textContent='Foto local salva ✓'}catch(e){d.querySelector('#ps'+i).textContent='Não foi possível salvar: armazenamento indisponível.'}};img.onerror=()=>{URL.revokeObjectURL(u);d.querySelector('#ps'+i).textContent='Arquivo inválido.'};img.src=u});d.querySelector('#finishPhotos').onclick=()=>{location.hash='';location.reload()};}

function carCard(c){return `<article class="card car">${carArt(c)}<div class="carbody"><div class="row">${badge(c.status)}<small>Joinville</small></div><h3 style="margin-top:12px">${esc(c.name)}</h3><p class="muted">${esc(c.type)} · ${c.km.toLocaleString('pt-BR')} km<br>${c.travel?'Permite solicitação interestadual':'Circulação local'}</p><div class="row"><div><span class="price">${money(c.price)}</span><small> / dia</small></div><button onclick="book(${c.id})">Reservar</button></div></div></article>`}function overlap(c,a,b,skip){return data.rentals.some(r=>r.id!==skip&&r.car===c&&!['Cancelada','Encerrada'].includes(r.status)&&a<r.end&&b>r.start)}function catalog(){if(visitor||!['rent'].includes(role))return "";return heading('Encontre seu próximo carro','Alugue diretamente de proprietários em Joinville.')+`<div class="panel" id="search"><h2>Buscar veículos</h2><div class="filters"><label>Modelo<input id="q" placeholder="Ex.: Polo" oninput="filterCars()"></label><label>Preço máximo / dia<input id="maxprice" type="number" min="0" placeholder="R$" oninput="filterCars()"></label><label>Quilometragem máxima<input id="maxkm" type="number" min="0" oninput="filterCars()"></label><label>Categoria<select id="type" onchange="filterCars()"><option value="">Todas</option><option>Hatch</option><option>SUV</option><option>Sedã</option></select></label><label>Retirada<input id="start" type="date" onchange="filterCars()"></label><label>Devolução<input id="end" type="date" onchange="filterCars()"></label><label>Circulação<select id="travel" onchange="filterCars()"><option value="">Todas</option><option value="yes">Outros estados</option></select></label><label>Ordenar<select id="sort" onchange="filterCars()"><option value="">Relevância</option><option value="asc">Menor preço</option><option value="desc">Maior preço</option></select></label></div></div><div class="row"><h2>Carros disponíveis</h2><small id="count"></small></div><div class="grid" id="results"></div>`}function filterCar 'Forma de pagamento indisponível para este cadastro.');let deferred=method.startsWith('Dinheiro')||method.startsWith('Cripto');data.rentals.push({method,payAccept:[],id:Date.now(),car:id,user:uid,start:a,end:b,pickup:f.pickup.value,dropoff:f.dropoff.value,price:c.price,total:Math.round(n*(c.price*(1+data.settings.fee/100)+data.settings.insurance)*100)/100,status:'Reservada',payment:deferred?'Pendente na entrega':'Pago (demo)',insured:true,limit:data.settings.limit,extra:data.settings.extra,fee:data.settings.fee,checks:{}});done('Reserva confirmada · pagamento e seguro simulados.');go('rentals')}
function dashboard(){if(visitor||!['owner', 'admin'].includes(role))return "";let list=visibleRentals(),own=data.cars.filter(c=>ownsCar(c.id));return heading(role==='admin'?'Painel administrativo':'Olá, '+esc(ownerName())+'!' ,'Acompanhe seus indicadores, atividades e próximos passos.')+`<div class="hero"><div class="eyebrow">${role==='admin'?'CENTRAL DE OPERAÇÕES':'ESPAÇO DO PROPRIETÁRIO'}</div><h2>${role==='admin'?'Gerencie a mobilidade com confiança.':'Seu carro pode ir mais longe.'}</h2><p>${role==='admin'?'Valide documentos, aprove veículos e acompanhe locações e ocorrências.':'Controle seus anúncios, reservas e ganhos em um único painel.'}</p><button onclick="go('${role==='admin'?'users':'cars'}')">${role==='admin'?'Analisar cadastros':'Gerenciar veículos'} →</button></div><div class="grid">${metric('Veículos',role==='admin'?data.cars.length:own.length,'Frota cadastrada')}${metric('Locações abertas',list.filter(r=>!['Encerrada','Cancelada'].includes(r.status)).length,'Reservas e contratos')}${metric(role==='admin'?'Cadastros pendentes':'Receita bruta encerrada',role==='admin'?data.users.filter(u=>u.status==='Pendente').length:money(list.filter(r=>r.status==='Encerrada').reduce((s,r)=>s+r.price*days(r.start,r.end),0)),'Resumo operacional')}${metric('Ocorrências',data.cases.filter(c=>c.status!=='Resolvida'&&list.some(r=>r.id===c.rental)).length,'Em acompanhamento')}</div><div class="panel"><h2>Locações recentes</h2>${rentalTable(list.slice(-5))}</div>`}function rentalTable(list){return table(['Veículo','Período','Total','Situação','Ação'],list.map(r=>[esc(car(r.car)?.name),`${r.start} → ${r.end}`,money(r.total+(r.excess||0)),badge(r.status),`<button onclick="details(${r.id})">Detalhes</button>`]))}function rentals(){return heading('Locações','Cada reserva tem seu próprio contrato, seguro e checklist.')+`<div class="row">${role==='admin'?'<button onclick="adminBook()">+ Criar reserva para cliente</button>':role==='rent'?'<button onclick="go(\'home\')">+ Nova reserva</button>':''}<span class="muted">${visibleRentals().length} registros</span></div><div class="panel">${rentalTable(visibleRentals())}</div>`}function adminBook(){if(!permitted('admin'))return;open('Escolher veículo',data.cars.filter(c=>c.status==='Disponível').map(c=>`<p class="row">${esc(c.name)} <button onclick="modal.close();book(${c.id})">Selecionar</button></p>`).join(''))}function details(id){if(!rentalAllowed(id))return toast('Locação não disponível para esta conta.');let r=rental(id),c=car(r.car);open('Locação #'+String(id).slice(-6),`<h3>${esc(c.name)}</h3>${badge(r.status)}<div class="notice">${r.start} ${r.pickup||''} até ${r.end} ${r.dropoff||''}<br>Diárias: ${money(r.price)} · Total: ${money(r.total+(r.excess||0))}<br>Seguro: ${r.insured?'Cobertura simulada':'Pendente'} · Pagamento: ${esc(r.payment)}<br>Forma: ${esc(r.method||'Não registrada')}<br>Limite: ${r.limit} km · Excedente: ${money(r.extra)}/km (demo)<br>Distância registrada: ${r.distance??0} km · Restante: ${Math.max(0,r.limit-(r.distance||0))} km</div>${paymentPanel(r)}<p>Contrato demonstrativo · devolução limpa e tanque cheio, salvo acordo registrado.</p><div class="row">${['Reservada','Em andamento'].includes(r.status)?`<button onclick="modal.close();checkForm(${id},'${r.status==='Reservada'?'retirada':'devolução'}')">Checklist ${r.status==='Reservada'?'de retirada':'de devolução'}</button>`:''}${r.status==='Reservada'&&role!=='owner'?`<button class="secondary" onclick="cancelRent(${id})">Cancelar</button><button class="secondary" onclick="changeRent(${id})">Alterar período</button>`:''}${c.travel&&role==='rent'?`<button class="secondary" onclick="modal.close();caseForm(${id},'Autorização interestadual')">Solicitar viagem</button>`:''}<button class="secondary" onclick="modal.close();caseForm(${id})">Registrar ocorrência</button></div>`)}function cancelRent(id){if(!permitted("rent","admin"))return;if(!rentalAllowed(id))return toast('Locação não disponível para esta conta.');if(confirm('Ca const angles=['Frente','Traseira','Lateral esquerda','Lateral direita','Interior','Painel'];function photos(){return `<div class="photos">${angles.map((a,i)=>`<label class="photo">${a}<img id="preview${i}" hidden alt="Prévia ${a}"><input type="file" name="photo${i}" accept="image/*" required onchange="preview(this,${i})"></label>`).join('')}</div>`}function preview(el,i){let img=$('preview'+i);if(el.files[0]){img.src=URL.createObjectURL(el.files[0]);img.hidden=false}}function conditionFields(km){return `<div class="formgrid">${['Lataria','Pneus','Interior','Luzes','Documentos'].map((x,i)=>`<label>${x}<select name="item${i}"><option>Em ordem</option><option>Com ressalva</option></select></label>`).join('')}<label>Odômetro (km)<input name="km" type="number" min="0" value="${km}" required></label><label>Combustível<select name="fuel"><option>Cheio</option><option>3/4</option><option>1/2</option><option>1/4</option><option>Vazio</option></select></label><label>Limpeza<select name="clean"><option>Limpo</option><option>Precisa de limpeza</option></select></label></div><label>Avarias / observações<textarea name="obs" placeholder="Descreva as condições ou acordos"></textarea></label>`}async function collect(f){let files=await Promise.all(angles.map((a,i)=>new Promise((resolve,reject)=>{let file=f['photo'+i].files[0];if(!file)return resolve('');let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})));return {km:+f.km.value,fuel:f.fuel.value,clean:f.clean.value,obs:f.obs.value,items:Array.from({length:5},(_,i)=>f['item'+i].value),photos:files,time:new Date().toLocaleString('pt-BR'),accept:[]}}function initialCheck(id){if(!permitted('admin'))return;let c=car(id);open('Vistoria inicial · '+c.name,`<form onsubmit="saveInitial(event,${id})">${conditionFields(c.km)}<h3>Registro fotográfico</h3>${photos()}<label>Decisão<select name="decision"><option>Aprovado</option><option>Reprovado</option></select></label><label>Justificativa<textarea name="reason" required></textarea></label><button>Registrar avaliação</button></form>`)}async function saveInitial(e,id){if(!permitted('admin'))return;e.preventDefault();let f=e.target,c=car(id);try{c.initial=await collect(f);c.initial.reason=f.reason.value;c.status=f.decision.value==='Aprovado'?'Disponível':'Reprovado';done('Avaliação registrada e proprietário notificado.')}catch{toast('Falha ao ler as imagens.')}}function checks(){return heading('Checklist do veículo','Vistoria de retirada e devolução com aceite das duas partes.')+`<div class="notice">Anexe fotos de frente, traseira, laterais, interior e painel. O registro fica bloqueado após envio nesta demonstração.</div><div class="panel">${table(['Veículo','Retirada','Devolução','Ação'],visibleRentals().filter(r=>r.status!=='Cancelada').map(r=>[esc(car(r.car).name),r.checks.retirada?badge(r.checks.retirada.accept.length===2?'Confirmada':'Pendente de aceite'):'Não iniciada',r.checks.devolução?badge(r.checks.devolução.accept.length===2?'Confirmada':'Pendente de aceite'):'Não iniciada',`<button onclick="checkForm(${r.id},'retirada')">Retirada</button> <button class="secondary" onclick="checkForm(${r.id},'devolução')">Devolução</button>`]))}</div>`}function showCheck(c){return `<p>${esc(c.time)} · ${c.km} km · ${esc(c.fuel)} · ${esc(c.clean)}</p><p>${esc(c.obs)||'Sem observações'}</p><div class="photos">${c.photos.map((p,i)=>`<div class="photo">${angles[i]}${p?`<img src="${p}" alt="${angles[i]}">`:''}</div>`).join('')}</div><p>Aceites: ${c.accept.map(a=>a==='rent'?'Locatário':'Proprietário').join(', ')||'Nenhum'}</p>`}function checkForm(id,phase){if(!rentalAllowed(id))return toast('Locação não disponível para esta conta.');let r=rental(id),c=r.checks[phase];if(phase==='devolução'&&r.checks.retirada?.accept.length!==2)return toast('Confirme a retirada primeiro.');if(c){open('Checklist de '+phase,`${phase==='devolução'?'<h3>Retirada — referência</h3>'+showCheck(r.checks.retirada)+'<hr><h3>Devolução</h3>':''}${showCheck(c)}${role!=='admin'&&!c.accept.includes(role)?`<button onclick="acceptCheck(${id},'${phase}')">Confirmar checklist como ${role==='rent'?'locatário':'proprietário'}</button>`:''}<p class="muted">Evidências bloqueadas na interface; integridade real depende do servidor.</p>`);return}if(role==='admin')return toast('Aguardando envio do proprietário ou locatário.');if(!['Reservada','Em andamento'].includes(r.status))return toast('Locação não está aberta.');open('Checklist de '+phase,`<form onsubmit="saveCheck(event,${id},'${phase}')">${conditionFields(phase==='devolução'?r.checks.retirada.km:car(r.car).km)}<h3>Fotos obrigatórias</h3>${photos()}<p class="notice">O envio bloqueia a edição. Os dois perfis devem confirmar separadamente.</p><button>Enviar checklist</button></form>`)}async function saveCheck(e,id,phase){if(!permitted('rent','owner')||!['retirada','devolução'].includes(phase))return;if(rental(id)?.checks[phase])return toast('Checklist já registrado.');if(!rentalAllowed(id))return toast('Locação não disponível para esta conta.');e.preventDefault();let r=rental(id),f=e.target;if(phase==='devolução'&&+f.km.value<r.checks.retirada.km)return toast('Odômetro não pode diminuir.');try{r.checks[phase]=await collect(f);done('Checklist enviado. Aguardando aceite das duas partes.')}catch{toast('Erro ao carregar fotos.')}}function acceptCheck(id,phase){if(!rentalAllowed(id))return toast('Locação não disponível para esta conta.');let r=rental(id),c=r.checks[phase];if(role==='admin'||c.accept.includes(role))return;if(phase==='retirada'&&r.payment==='Pendente na entrega')return toast('Confirme o pagamento na página da locação antes da retirada.');if(phase==='retirada'&&!r.insured)return toast('Seguro necessário.');c.accept.push(role);if(c.accept.length===2){if(phase==='retirada')r.status='Em andamento';else{let a=r.checks.retirada;r.distance=c.km-a.km;r.excess=Math.round(Math.max(0,r.distance-r.limit)*r.extra*100)/100;let diff=c.fuel!==a.fuel||c.clean!==a.clean||c.items.some((x,i)=>x!==a.items[i])||c.obs!==a.obs;r.status=diff?'Em análise':'Encerrada';if(diff)data.cases.push({id:Date.now(),rental:id,type:'Divergência de checklist',description:'Diferenças entre retirada e devolução.',status:'Pendente'});}}done('Aceite registrado. '+r.status)}
function users(){if(visitor||!['admin'].includes(role))return "";return heading('Usuários e documentos','Validação cadastral de brasileiros e estrangeiros.')+`<div class="panel">${table(['Usuário','Cadastro','Documentação fictícia','Status','Ação'],data.users.map(u=>[esc(u.name),esc(u.type),esc(u.doc),badge(u.status),`<button onclick="reviewUser(${u.id})">Analisar</button>`]))}</div>`}function reviewUser(id){if(!permitted('admin'))return;let u=data.users.find(x=>x.id===id);open('Analisar cadastro',`<p>${esc(u.name)} · ${esc(u.doc)}</p><form onsubmit="reviewSave(event,${id})"><label>Decisão<select name="decision"><option>Aprovado</option><option>Reprovado</option></select></label><label>Justificativa<textarea name="reason" required></textarea></label><button>Registrar decisão</button></form>`)}function reviewSave(e,id){if(!permitted('admin'))return;e.preventDefault();let u=data.users.find(x=>x.id===id);u.status=e.target.decision.value;u.reason=e.target.reason.value;done('Cadastro '+u.status.toLowerCase()+'.')}
function profile(){if(visitor||!['rent', 'owner'].includes(role))return "";let u=data.users.find(x=>x.id===user);return heading('Meu cadastro','Inclusão de brasileiros e estrangeiros.')+`<div class="panel"><div class="row"><h2>${esc(u.name)}</h2>${badge(u.status)}</div><p>${esc(u.type)} · ${esc(u.doc)}</p><p>Perfil: ${role==='rent'?'Locatário':'Proprietário'}</p></div><div class="panel"><h2>Preferências</h2><p>Idiomas disponíveis no escopo: português, espanhol, inglês e crioulo haitiano.</p><p>Recuperação de acesso e autenticação real dependem do servidor.</p><button class="secondary" onclick="toast('Solicitação fictícia de recuperação registrada.')">Simular recuperação de senha</button></div>`}function oldSignup(){open('Cadastro inclusivo',`<form onsubmit="signupSave(event)"><label>Tipo de cadastro<select name="kind" onchange="docFields(this.value)"><option>Brasileiro</option><option>Estrangeiro</option></select></label><div class="formgrid"><label>Nome fictício<input name="name" required></label><label>E-mail fictício<input name="email" type="email" required placeholder="demo@example.com"></label><label>Telefone fictício<input name="phone" required></label><label>Data de nascimento fictícia<input type="date" name="birth" required></label><label>Endereço fictício<input name="address" required></label></div><div id="docs"></div><label><input type="checkbox" required> Confirmo que estes dados são fictícios.</label><button>Enviar para análise</button></form>`);docFields('Brasileiro')}function docFields(v){$('docs').innerHTML=v==='Brasileiro'?'<div class="notice">CPF, RG e CNH para quem dirige.</div><label>Documentos<input required name="doc" placeholder="DOC-DEMO"></label>':'<div class="notice">Passaporte e habilitação estrangeira; validade sujeita à análise jurídica. Sem exigir documentos brasileiros.</div><div class="formgrid"><label>País de origem<input required name="country"></label><label>País emissor<input required name="issuer"></label><label>Validade<input type="date" required name="valid"></label><label>Número do documento<input required name="doc" placeholder="Número do passaporte"></label></div>'}function oldSignupSave(e){e.preventDefault();let f=e.target,u=data.users.find(x=>x.id===user);u.name=f.elements.namedItem('name').value;u.type=f.elements.namedItem('kind').value;u.doc=u.type==='Brasileiro'?'CPF / RG / CNH (demo)':'Passaporte / habilitação (demo)';u.status='Pendente';done('Cadastro enviado para análise.')}
function finance(){let list=visibleRentals();if(role==='rent')return heading('Meus pagamentos','Acompanhe exclusivamente as cobranças das suas locações.')+`<div class="grid">${metric('Total contratado',money(list.filter(r=>r.status!=='Cancelada').reduce((a,r)=>a+r.total,0)),'Suas locações')}${metric('Em atraso',list.filter(r=>r.payment==='Atrasado').length,'Seus pagamentos')}</div><div class="panel">${table(['Veículo','Valor','Pagamento','Comprovante'],list.map(r=>[esc(car(r.car).name),money(r.total+(r.excess||0)),badge(r.payment),`<button onclick="details(${r.id})">Ver locação</button>`]))}</div>`;if(role==='owner'){let net=r=>r.price*days(r.start,r.end)*(1-r.fee/100);return heading('Meus ganhos','Extrato dos veículos da sua conta.')+`<div class="grid">${metric('Repasse estimado',money(list.filter(r=>r.status==='Encerrada'&&r.payment!=='Atrasado').reduce((a,r)=>a+net(r),0)),'Locações encerradas sem atraso')}${metric('Reservas em aberto',list.filter(r=>!['Encerrada','Cancelada'].includes(r.status)).length,'Seus veículos')}</div><div class="panel">${table(['Veículo','Período','Repasse estimado','Situação'],list.map(r=>[esc(car(r.car).name),esc(r.start+' → '+r.end),r.status==='Encerrada'&&r.payment!=='Atrasado'?money(net(r)):'Aguardando conclusão',badge(r.status)]))}</div>`}return heading('Cobranças e repasses','Controle exclusivo da equipe EasyCar.')+`<div class="panel">${table(['Veículo','Total','Pagamento','Ação'],list.map(r=>[esc(car(r.car).name),money(r.total+(r.excess||0)),badge(r.payment),`<button onclick="details(${r.id})">Detalhes</button> <button class="secondary" onclick="payment(${r.id})">${r.payment==='Atrasado'?'Regularizar':'Simular atraso'}</button>`]))}</div>`}
function payment(id){if(!permitted('admin'))return;let r=rental(id);if(r.payment==='Pendente na entrega')return toast('Aguardando confirmação das duas partes.');r.payment=r.payment==='Atrasado'?'Pago (demo)':'Atrasado';note('Pagamento atualizado: '+r.payment);render()}
function cases(){let ids=visibleRentals().map(r=>r.id),list=data.cases.filter(c=>ids.includes(c.rental));return heading('Ocorrências e suporte',role==='admin'?'Sinistros, multas, disputas, autorizações e jurídico.':role==='owner'?'Ocorrências dos seus veículos.':'Suporte para suas locações.')+`<div class="panel"><div class="row"><h2>Casos registrados</h2><button onclick="casePick()">+ Registrar caso</button></div>${table(['Tipo','Locação','Descrição','Status','Ação'],list.map(c=>[esc(c.type),esc(car(rental(c.rental).car).name),esc(c.description),badge(c.status),role==='admin'?`<button onclick="resolveCase(${c.id})">Analisar</button>`:'Acompanhamento']))}</div>${role==='admin'?`<div class="panel"><h2>Inadimplência</h2>${table(['Locação','Pagamento','Ação'],data.rentals.filter(r=>r.payment==='Atrasado').map(r=>[esc(car(r.car).name),badge(r.payment),`<button onclick="caseForm(${r.id},'Encaminhamento jurídico')">Encaminhar</button>`]))}</div>`:''}`}function casePick(){let list=visibleRentals();open('Escolha uma locação',list.map(r=>`<p class="row">${esc(car(r.car).name)}<button onclick="modal.close();caseForm(${r.id})">Selecionar</button></p>`).join('')||'Crie uma reserva primeiro.')}function caseTypes(){return role==='admin'?['Sinistro / avaria','Multa','Disputa','Autorização interestadual','Encaminhamento jurídico']:role==='owner'?['Sinistro / avaria','Multa','Disputa']:['Sinistro / avaria','Disputa','Autorização interestadual'];}function caseForm(id,type='Sinistro / avaria'){if(!rentalAllowed(id))return toast('Locação não disponível para esta conta.');open('Registrar caso',`<form onsubmit="saveCase(event,${id})"><label>Tipo<select name="type">${caseTypes().map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select></label><div class="formgrid"><label>Data<input type="date" name="date" required></label><label>Hora<input type="time" name="time" required></label><label>Local / destino<input name="place" required></label></div><label>Descrição<textarea name="description" required></textarea></label><label>Anexo fictício<input type="file" name="attachment" accept="image/*,.pdf"></label><button>Registrar</button></form>`)}function saveCase(e,id){if(!caseTypes().includes(e.target.type.value))return toast('Tipo de ocorrência não permitido.');if(!rentalAllowed(id))return toast('Locação não disponível para esta conta.');e.preventDefault();let f=e.target,r=rental(id);if(f.type.value==='Autorização interestadual'&&!car(r.car).travel)return toast('Este veículo não permite solicitação interestadual.');if(f.type.value==='Multa'&&(f.date.value<r.start||f.date.value>r.end))return toast('Data fora do período da locação selecionada.');data.cases.push({id:Date.now(),rental:id,type:f.type.value,description:f.description.value,status:'Pendente',date:f.date.value,time:f.time.value,place:f.place.value,attachment:f.attachment.files[0]?.name||''});done('Caso registrado para acompanhamento.')}
function resolveCase(id){if(!permitted('admin'))return;let c=data.cases.find(x=>x.id===id);open('Analisar caso',`<p>${esc(c.type)} · ${esc(c.description)}</p><form onsubmit="caseDecision(event,${id})"><label>Decisão<select name="status"><option>Em análise</option><option>Aprovada</option><option>Negada</option><option>Resolvida</option><option>Encaminhada ao jurídico</option></select></label><label>Justificativa<textarea name="reason" required></textarea></label><button>Salvar decisão</button></form>`)}function caseDecision(e,id){if(!permitted('admin'))return;e.preventDefault();let c=data.cases.find(x=>x.id===id);c.status=e.target.status.value;c.reason=e.target.reason.value;done('Decisão registrada.')}
function settings(){if(visitor||!['admin'].includes(role))return "";return heading('Configurações e relatórios','Parâmetros de operação e histórico de ações.')+`<div class="panel"><h2>Parâmetros demonstrativos</h2><div class="notice">Valores não confirmados pelos stakeholders são apenas hipóteses de teste.</div><form onsubmit="saveSettings(event)"><div class="formgrid">${[['limit','Limite km por contrato'],['extra','Taxa excedente R$/km'],['fee','Taxa plataforma %'],['insurance','Seguro R$/dia'],['max','Limite de veículos']].map(([k,t])=>`<label>${t}<input type="number" min="${k==='max'?1:0}" step="${['limit','max'].includes(k)?1:'.01'}" name="${k}" value="${data.settings[k]}" required></label>`).join('')}</div><div class="row"><button>Salvar parâmetros</button><button type="button" class="secondary" onclick="exportReport()">Exportar relatório CSV</button></div></form></div><div class="panel"><h2>Log de atividades</h2>${data.audit.map(x=>`<p>${esc(x)}</p>`).join('')||'Sem atividades.'}</div><button class="danger" onclick="resetDemo()">Reiniciar demonstração</button>`}function saveSettings(e){if(!permitted('admin'))return;e.preventDefault();for(let k in data.settings)data.settings[k]=+e.target.elements[k].value;note('Parâmetros atualizados.');render();toast('Configurações salvas.')}function exportReport(){if(!permitted('admin'))return;let csv='Veículo;Início;Fim;Status;Total;Pagamento\n'+data.rentals.map(r=>[car(r.car).name,r.start,r.end,r.status,r.total,r.payment].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='easycar-relatorio.csv';a.click();URL.revokeObjectURL(a.href)}function resetDemo(){if(!permitted('admin'))return;if(confirm('Apagar alterações locais da demonstração?')){data=structuredClone(seed);save();go('home')}}function notifications(){return heading('Notificações','Histórico demonstrativo de eventos da plataforma.')+`<div class="panel">${data.notes.filter(x=>typeof x==='string'||role==='admin'||(x.user===user&&x.role===role)).map(x=>`<p>● ${esc(typeof x==='string'?x:x.message)}</p>`).join('')}</div>`}
function render(){$('publicbar').inert=!visitor;$('publicbar').hidden=!visitor;document.body.dataset.profile=visitor?'visitor':role;if(visitor){$('nav').innerHTML='';$('roleLabel').textContent='';renderPublic();return}let menu=menus[role];if(!menu.some(x=>x[0]===page)&&page!=='notifications')page='home';$('roleLabel').textContent=({rent:'LOCATÁRIO',owner:'PROPRIETÁRIO',admin:'ADMINISTRADOR'})[role]+' · '+(userObj()?.name||'Equipe EasyCar');$('nav').innerHTML=menu.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${t}</button>`).join('');$('crumb').textContent=menu.find(x=>x[0]===page)?.[2]||'Notificações';let views={home:role==='rent'?catalog:dashboard,cars,rentals,check:checks,finance,cases,profile,users,settings,notifications};$('content').innerHTML=(views[page]||views.home)();filterCars()}
let visitor=true,demoMode=false;

function renderPublic(){if(!visitor)return toast("Saia da conta para acessar outra área."); $('content').innerHTML=`<section class="welcome"><div><span class="tag">ALUGUEL DE CARROS EM JOINVILLE</span><h1>Um carro para cada momento.</h1><p>Alugue de pessoas da sua cidade ou ganhe dinheiro com seu próprio carro.</p><div class="publicactions"><button onclick="document.getElementById('search').scrollIntoView({behavior:'smooth'})">Encontrar um carro</button><button class="secondary" onclick="signup('owner')">Anunciar meu carro</button></div></div>${carArt({color:'#78b3a6'})}</section>${catalog()}<section class="panel"><h2>Como funciona?</h2><div class="grid simple-steps"><div><b>1. Crie sua conta</b><p>Brasileiro ou estrangeiro.</p></div><div><b>2. Escolha um carro</b><p>Veja o preço e as datas.</p></div><div><b>3. Retire e devolva</b><p>Confira o carro com fotos.</p></div></div></section><section class="panel"><h2>Teste o projeto</h2><p>Experimente o site com uma conta fictícia já aprovada.</p><div class="publicactions"><button class="secondary" onclick="enter(1,'rent',true)">Locatário</button><button class="secondary" onclick="enter(2,'owner',true)">Proprietário</button></div></section>`;filterCars()}
function login(kind=null){if(!visitor)return toast("Saia da conta para acessar outra área.");open(kind==='owner'?'Entrar como proprietário':kind==='rent'?'Entrar como locatário':'Entrar na EasyCar',`<p>Use uma conta fictícia criada neste navegador.</p><form onsubmit="loginSave(event)"><input type="hidden" name="expectedRole" value="${kind||''}"><label>E-mail<input type="email" name="email" required placeholder="cliente@example.com"></label><label>Código de demonstração<input name="code" type="password" required placeholder="demo123"></label><p class="muted">Use o código fictício demo123. Não utilize uma senha real.</p><button class="wide">Entrar</button></form><button class="secondary wide" onclick="demoEnter('${kind||"rent"}')">Entrar com conta de teste</button><p class="authlink">Ainda não tem conta? <button class="secondary" onclick="modal.close();signup('${kind||'rent'}')">Criar conta</button></p><p class="muted">Conta de teste: ${kind==='owner'?'proprietario@easycar.demo':'locatario@easycar.demo'} · código demo123.</p>`)}
function loginSave(e){if(!visitor)return toast("Saia da conta para acessar outra área.");e.preventDefault();const f=e.target,u=data.users.find(u=>u.email?.toLowerCase()===f.elements.namedItem('email').value.trim().toLowerCase());if(!u)return toast('Conta não encontrada. Crie uma conta primeiro.');if(f.elements.namedItem('code').value!=='demo123')return toast('Código inválido.');if(f.elements.namedItem('expectedRole')?.value&&u.role!==f.elements.namedItem('expectedRole').value)return toast('Esta conta pertence a outro perfil. Escolha o acesso correspondente.');if(!['rent','owner'].includes(u.role))return toast('Perfil inválido.');modal.close();enter(u.id,u.role);if(u.role==='rent'&&selectedCar){let id=selectedCar;selectedCar=null;book(id)}}
function signup(kind='rent'){if(!visitor)return toast("Saia da conta para acessar outra área.");open('Criar sua conta',`<p>Preencha os dados fictícios para simular um cadastro. Não envie dados ou documentos reais.</p><form onsubmit="signupSave(event)"><label>Idioma<select name="language"><option>Português</option><option>Español</option><option>English</option><option>Kreyòl ayisyen</option></select></label><label>Quero usar a EasyCar como<select name="role"><option value="rent">Locatário — alugar carros</option><option value="owner" ${kind==='owner'?'selected':''}>Proprietário — anunciar carros</option></select></label><label>Tipo de cadastro<select name="kind" onchange="docFields(this.value)"><option>Brasileiro</option><option>Estrangeiro</option></select></label><div class="formgrid"><label>Nome completo<input name="name" required placeholder="Nome fictício"></label><label>E-mail<input name="email" type="email" required placeholder="cliente@example.com"></label><label>Telefone<input name="phone" required placeholder="Telefone fictício"></label><label>Data de nascimento<input type="date" name="birth" required></label></div><label>Endereço<input name="address" required placeholder="Endereço fictício"></label><div id="docs"></div><label><input type="checkbox" required> Confirmo que os dados são fictícios e aceito o cadastro demonstrativo.</label><button class="wide">Criar conta e enviar para análise</button></form>`);docFields('Brasileiro')}
function docFields(v){$('docs').innerHTML=v==='Brasileiro'?`<h3>Documentos</h3><div class="formgrid"><label>CPF<input name="cpf" required placeholder="000.000.000-00"></label><label>RG<input name="rg" required placeholder="Número do RG"></label><label>CNH (se for dirigir)<input name="cnh" placeholder="Número da CNH"></label></div>`:`<h3>Documentos</h3><div class="formgrid"><label>Nacionalidade<input name="country" required></label><label>País emissor<input name="issuer" required></label><label>Passaporte ou documento válido<input name="passport" required placeholder="Número do passaporte"></label><label>Habilitação de origem (se for dirigir)<input name="license" placeholder="Número da habilitação"></label><label>Validade do documento<input type="date" name="valid" required></label></div><p class="muted">Não é necessário CPF, RG ou CNH brasileiros neste fluxo. A aceitação definitiva depende de análise.</p>`}
function signupSave(e){if(!visitor)return toast("Saia da conta para acessar outra área.");e.preventDefault();const f=e.target,email=f.elements.namedItem('email').value.trim().toLowerCase();if(data.users.some(u=>u.email===email))return toast('E-mail já cadastrado. Use Entrar.');if(f.elements.namedItem('valid')&&f.elements.namedItem('valid').value<new Date().toISOString().slice(0,10))return toast('Documento vencido.');const uid=Date.now();data.users.push({id:uid,name:f.elements.namedItem('name').value,email,role:f.elements.namedItem('role').value,type:f.elements.namedItem('kind').value,doc:f.elements.namedItem('kind').value==='Brasileiro'?'CPF / RG / CNH (demo)':'Passaporte / habilitação (demo)',status:'Pendente',language:f.elements.namedItem('language').value});note('Novo cadastro aguardando análise: '+f.elements.namedItem('name').value);modal.close();enter(uid,f.elements.namedItem('role').value);go('profile');toast('Conta criada! Aguarde a aprovação do administrador.')}


const searchState={start:'',end:'',pickup:'10:00',dropoff:'10:00',category:'',q:'',maxprice:'',maxkm:'',travel:'',sort:'asc'};
function scrollToSection(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function dateLocal(offset){let d=new Date();d.setDate(d.getDate()+offset);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
searchState.start=dateLocal(1);searchState.end=dateLocal(4);
function searchBox(){return `<form class="searchbar" onsubmit="runSearch(event)"><label>Local de retirada<select aria-label="Local de retirada"><option>Joinville, SC</option></select></label><label>Retirada<input type="date" id="start" min="${dateLocal(0)}" required value="${searchState.start}"></label><label>Hora<input type="time" id="pickup" required value="${searchState.pickup}"></label><label>Devolução<input type="date" id="end" min="${dateLocal(1)}" required value="${searchState.end}"></label><label>Hora<input type="time" id="dropoff" required value="${searchState.dropoff}"></label><button class="searchbtn">Buscar carros →</button></form>`}
function runSearch(e){e.preventDefault();if($('end').value<=$('start').value)return toast('Escolha uma devolução após a retirada.');for(let k of ['start','end','pickup','dropoff'])searchState[k]=$(k).value;filterCars();scrollToSection('catalogue')}
function categoryPick(c){searchState.category=c;$('type').value=c;filterCars();scrollToSection('catalogue')}
function filterPanel(){return `<section id="catalogue" class="catalogue"><div class="sectiontop"><div><span class="tag">ESCOLHA O SEU CARRO</span><h2>Carros para todos os caminhos</h2><p class="muted" id="count"></p></div><label>Ordenar por<select id="sort" onchange="filterCars()"><option value="asc">Menor preço</option><option value="desc">Maior preço</option></select></label></div><div class="cataloglayout"><div class="filterpanel"><h3>Filtrar resultados</h3><label>Modelo<input id="q" placeholder="Ex.: Polo" oninput="filterCars()"></label><label>Preço máximo por dia<input id="maxprice" type="number" min="0" placeholder="Sem limite" oninput="filterCars()"></label><label>Categoria<select id="type" onchange="filterCars()"><option value="">Todas</option><option>Hatch</option><option>SUV</option><option>Sedã</option></select></label><label>Quilometragem máxima<input id="maxkm" type="number" min="0" placeholder="Sem limite" oninput="filterCars()"></label><label>Circulação<select id="travel" onchange="filterCars()"><option value="">Todas</option><option value="yes">Outros estados (autorização)</option></select></label><button class="secondary wide" onclick="clearFilters()">Limpar filtros</button></div><div id="results" class="resultgrid"></div></div></section>`}
function clearFilters(){for(let k of ['q','maxprice','maxkm','type','travel'])$(k).value='';$('sort').value='asc';filterCars()}
function categoryStrip(){return `<section class="categories"><h2>Qual é o seu estilo de viagem?</h2><div class="categorygrid">${[['','Todos os carros','Explore a frota'],['Hatch','Econômicos','Praticidade no dia a dia'],['Sedã','Sedãs','Conforto para viajar'],['SUV','SUVs','Mais espaço e conforto']].map(([v,t,d],i)=>`<button onclick="categoryPick('${v}')">${carArt({color:['#cbd6dc','#a6c8c4','#c8ced9','#82988d'][i]})}<strong>${t}</strong><small>${d}</small></button>`).join('')}</div></section>`}
function catalog(){if(visitor||!['rent'].includes(role))return "";return `<section id="search" class="insideSearch"><h1>Encontre seu próximo carro</h1><p>Escolha seu período de locação em Joinville.</p>${searchBox()}</section>${categoryStrip()}${filterPanel()}`}
function carCard(c){let n=Math.max(1,days($('start').value,$('end').value)||1),total=n*(c.price*(1+data.settings.fee/100)+data.settings.insurance);return `<article class="card car">${carArt(c)}<div class="carbody"><div class="row"><span class="badge">Verificado</span><small>Joinville, SC</small></div><h3>${esc(c.name)}</h3><p class="muted">${esc(c.type)} · ${c.km.toLocaleString('pt-BR')} km</p><div class="carfeatures"><span>✓ Seguro por período</span><span>✓ ${c.travel?'Viagem sob autorização':'Circulação local'}</span></div><hr><small>Diária a partir de</small><div class="price">${money(c.price)} <small>/ dia</small></div><p class="muted">${n} diárias · total estimado ${money(total)}</p><button class="wide" onclick="vehicleDetail(${c.id})">Ver detalhes e reservar →</button></div></article>`}
let selectedCar=null;
function vehicleDetail(id){if(!visitor&&!permitted('rent'))return;let c=car(id);if(!c||c.status!=='Disponível')return toast('Veículo indisponível.');selectedCar=id;let n=Math.max(1,days($('start')?.value||searchState.start,$('end')?.value||searchState.end)||1);open(c.name,`${carArt(c)}<div class="row"><span class="badge">Veículo aprovado</span><strong>${money(c.price)} / dia</strong></div><p>${esc(c.type)} · ${c.km.toLocaleString('pt-BR')} km · Joinville, SC</p><div class="notice">${n} diárias estimadas: ${money(n*c.price)}<br>Seguro demonstrativo: ${money(n*data.settings.insurance)}<br>Taxa demonstrativa: ${money(n*c.price*data.settings.fee/100)}<br><b>Total: ${money(n*(c.price*(1+data.settings.fee/100)+data.settings.insurance))}</b></div><p>Limite de ${data.settings.limit} km por contrato (premissa). ${c.travel?'Circulação interestadual mediante autorização.':'Circulação local.'} Retirada e devolução com checklist fotográfico.</p><button class="wide" onclick="modal.close();book(${id})">${visitor?'Entrar para continuar':'Continuar reserva'}</button>`)}
function renderPublic(){if(!visitor)return toast("Saia da conta para acessar outra área."); $('content').innerHTML=`<section class="commercialhero"><div class="herotext"><span class="heroeyebrow">MOBILIDADE COMPARTILHADA • JOINVILLE</span><h1>Liberdade para<br>ir mais longe.</h1><p>Encontre o carro ideal em Joinville, direto de proprietários locais. Reserve online, com seguro e transparência.</p></div><div class="heroart">${carArt({name:'Jeep Renegade'})}</div></section><section id="search" class="searchsurface"><div class="searchtitle"><h2>Encontre seu carro</h2><span>Retirada e devolução em Joinville</span></div>${searchBox()}</section><div class="quickaccess"><button onclick="login('rent')"><b>Locatário · Minhas reservas</b><span>Acesse sua área de locatário →</span></button><button onclick="login('owner')"><b>Proprietário · Meus veículos</b><span>Gerencie seus veículos →</span></button><button onclick="adminLogin()"><b>Equipe EasyCar</b><span>Acesso restrito →</span></button></div><section class="panel"><h2>EasyCar para todos</h2><p>Mobilidade sem barreiras: cadastro brasileiro ou estrangeiro, quatro idiomas e alternativas de pagamento para estrangeiros.</p><div class="grid"><div><b>Documentos</b><p>Passaporte e habilitação de origem, sujeitos à análise.</p></div><div><b>Idiomas</b><p>Português · Español · English · Kreyòl ayisyen</p></div><div><b>Pagamento inclusivo</b><p>Pix, crédito, débito e opções demonstrativas de dinheiro e criptomoedas para estrangeiros.</p></div></div></section><div class="truststrip"><span>✓ Veículos avaliados</span><span>✓ Seguro por locação</span><span>✓ Cadastro brasileiro e estrangeiro</span></div>${categoryStrip()}${filterPanel()}<section id="how" class="how"><span class="tag">SIMPLES DO INÍCIO AO FIM</span><h2>Alugue em três passos</h2><div class="grid">${[['01','Escolha seu carro','Compare as opções e selecione o período.'],['02','Reserve online','Crie sua conta, confirme o seguro e o pagamento.'],['03','Retire e devolva','Faça o checklist junto ao proprietário.']].map(([n,t,d])=>`<article class="card"><span class="stepnum">${n}</span><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></section><section class="ownerbanner" id="owner-section"><div><span class="tag">PARA PROPRIETÁRIOS</span><h2>Seu carro parado pode gerar renda.</h2><p>Cadastre seu veículo, defina sua diária e acompanhe as reservas em sua área exclusiva.</p><button onclick="signup('owner')">Quero anunciar meu carro →</button></div>${carArt({color:'#89b9a5'})}</section><section id="faq" class="faq"><h2>Perguntas frequentes</h2>${[['Quem pode se cadastrar?','Brasileiros e estrangeiros podem solicitar cadastro. Os documentos e a habilitação são avaliados pela equipe.'],['Como funciona o seguro?','A cobertura é vinculada ao período da locação. Condições e coparticipação estão sujeitas à definição da seguradora.'],['Posso alugar mais de um veículo?','Sim, respeitando os limites configurados pela equipe e a aprovação cadastral.'],['Como funciona a devolução?','Locatário e proprietário conferem fotos, combustível, limpeza, avarias e quilometragem.'],['Posso viajar para outro estado?','Somente com permissão registrada para o veículo e autorização da equipe.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</section><section class="sitefooter"><strong>easycar.</strong><div>Aluguel de carros em Joinville<br>Mobilidade compartilhada · Joinville</div><div class="footerlinks"><button class="secondary" onclick="accessPortal()">Acessos e perfis</button><button class="secondary" onclick="adminLogin()">Área da equipe</button></div></section>`;filterCars()}
$('publiclang').onchange=e=>{$('lang').value=e.target.value;$('lang').dispatchEvent(new Event('change'))};
render();if(location.hash==='#admin'&&visitor)adminLogin();

function paymentOptions(uid){const u=data.users.find(x=>x.id===uid);return ['Pix','Cartão de crédito','Cartão de débito',...(u?.type==='Estrangeiro'?['Dinheiro em reais (BRL)','Dinheiro em dólares (USD)','Cripto · Bitcoin (BTC)','Cripto · Ethereum (ETH)','Cripto · Tether (USDT)','Cripto · USD Coin (USDC)']:[])];}
function inclusivePay(){let f=$('bookform'),uid=role==='admin'?+f.elements.namedItem('client').value:user; $('inclusivePay').innerHTML=`<h3>Forma de pagamento</h3><label>Selecione uma opção<select name="pay" onchange="paymentHint(this.value)">${paymentOptions(uid).map(v=>`<option>${v}</option>`).join('')}</select></label><p id="paymentHint" class="notice">Pagamento simulado · nenhuma cobrança real.</p>`;}
function paymentHint(v){$('paymentHint').textContent=/^(Dinheiro|Cripto)/.test(v)?'Modalidade proposta para estrangeiros. Registro demonstrativo na entrega do veículo, com confirmação do locatário e proprietário. Total em reais; sem conversão ou transferência real.':'Pagamento simulado · nenhuma cobrança real.';}
function paymentPanel(r){if(!/^(Dinheiro|Cripto)/.test(r.method||''))return '';let a=r.payAccept||[];return `<div class="notice"><h3>Pagamento na entrega</h3><p>${esc(r.method)} · ${money(r.total)} (valor de referência em reais)</p><p>Locatário: ${a.includes('rent')?'Confirmado':'Pendente'} · Proprietário: ${a.includes('owner')?'Confirmado':'Pendente'}</p>${r.status==='Reservada'&&r.payment==='Pendente na entrega'&&['rent','owner'].includes(role)&&!a.includes(role)?`<button onclick="confirmDeliveryPayment(${r.id})">${role==='rent'?'Confirmar entrega do pagamento':'Confirmar recebimento'}</button>`:''}<small>Simulação acadêmica, sem movimentação financeira.</small></div>`;}
function confirmDeliveryPayment(id){if(!permitted('rent','owner')||!rentalAllowed(id))return;let r=rental(id);if(r.status!=='Reservada'||r.payment!=='Pendente na entrega')return;r.payAccept=r.payAccept||[];if(!r.payAccept.includes(role))r.payAccept.push(role);if(r.payAccept.includes('rent')&&r.payAccept.includes('owner'))r.payment='Pago (demo)';note('Confirmação demonstrativa de pagamento · '+role);render();details(id);}
function accessPortal(){if(!visitor)return;open('Acesse sua área',`<p>Escolha o acesso correspondente à sua conta.</p><div class="accessgrid"><article><span class="accessicon">01</span><h3>Locatário</h3><p>Reserve carros e acompanhe locações, pagamentos e vistorias.</p><button class="wide" onclick="modal.close();login('rent')">Entrar como locatário</button><button class="secondary wide" onclick="demoEnter('rent')">Testar perfil (demo)</button><button class="secondary wide" onclick="modal.close();signup('rent')">Criar conta</button></article><article><span class="accessicon">02</span><h3>Proprietário</h3><p>Anuncie seu veículo, acompanhe reservas e consulte seus ganhos.</p><button class="wide" onclick="modal.close();login('owner')">Entrar como proprietário</button><button class="secondary wide" onclick="demoEnter('owner')">Testar perfil (demo)</button><button class="secondary wide" onclick="modal.close();signup('owner')">Criar conta</button></article></div><div class="teamaccess"><b>Equipe EasyCar</b><p>Acesso exclusivo para administração.</p><button class="secondary" onclick="modal.close();adminLogin()">Entrar como administrador</button></div>`)}

function demoEnter(kind){if(!visitor||!['rent','owner','admin'].includes(kind))return; if(modal.open)modal.close();enter(kind==='admin'?null:kind==='owner'?2:1,kind,true);if(kind==='rent'&&selectedCar){const id=selectedCar;selectedCar=null;book(id)}}
</script></body></html>
